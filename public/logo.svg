<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="auraNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rotated cyan to teal rounded square (Navbar Logo) -->
  <rect x="16" y="16" width="68" height="68" rx="16" fill="url(#auraNavGrad)" transform="rotate(12 50 50)" />

  <!-- White filled Play triangle inside -->
  <polygon points="41,34 68,50 41,66" fill="#ffffff" />
</svg>
