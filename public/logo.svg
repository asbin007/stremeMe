<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#grad)" transform="rotate(12 50 50)" />

  <!-- Play triangle -->
  <polygon points="38,34 70,50 38,66" fill="white" />

  <!-- Small accent circle -->
  <circle cx="78" cy="22" r="6" fill="#ffffff" fill-opacity="0.12" />

  <!-- Brand text (visible in address bar / larger favicon) -->
  <text x="50" y="88" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="8" fill="#ffffff" font-weight="700">Aura Screen</text>
</svg>
