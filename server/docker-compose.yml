version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: strememe_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: .
    container_name: strememe_iptv_api
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - PLAYLIST_URL=https://iptv-org.github.io/iptv/index.m3u
    depends_on:
      - redis
    ports:
      - "3001:3001"

volumes:
  redis-data:
    driver: local
